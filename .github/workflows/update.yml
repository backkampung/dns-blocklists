name: Update combined blocklists

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours, UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-combined.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build combined lists (mini, pro, pro-max)
        run: python3 scripts/build-combined.py --all
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adblock/mini.txt adblock/pro.txt adblock/pro-max.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update combined blocklists [skip ci]"
            git push
          fi
